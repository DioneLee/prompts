<meta name="description" content="AI로 직접 만든 것들과, 그걸 만든 프롬프트를 모아둔 곳">
<meta property="og:title" content="프롬프트 보관함"><meta property="og:description" content="AI로 직접 만든 것들과, 그걸 만든 프롬프트를 모아둔 곳">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--gold:#c9a45c;--ink:#e9e1d0;--dim:#8d8577;--line:#2a2420}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% -10%,#1a1512 0%,#070607 55%) fixed,#070607;color:var(--ink);font-family:'Noto Serif KR',serif;line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased}
header{max-width:1000px;margin:0 auto;padding:84px 22px 40px;text-align:center}
.k{font-size:12px;letter-spacing:.55em;color:#c06a6a;margin-bottom:16px}
h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(32px,6vw,52px);letter-spacing:.1em}
.sub{margin-top:12px;color:#bdb4a2;font-size:clamp(14px,2.1vw,16px);font-weight:300}
.ln{width:110px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px auto 0}
main{max-width:1000px;margin:0 auto;padding:10px 22px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:#0c0a0a;transition:.25s;position:relative;overflow:hidden}
.card:hover{border-color:#6b5532;transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.th{aspect-ratio:16/10;background-size:cover;background-position:center 45%;position:relative}
.th:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(12,10,10,.95))}
.badge{position:absolute;top:12px;left:12px;z-index:1;font-size:11px;letter-spacing:.15em;color:var(--gold);background:rgba(8,6,6,.75);border:1px solid #4a3c28;padding:3px 9px}
.bd{padding:16px 18px 18px}
.bd h2{font-family:'Nanum Myeongjo',serif;font-size:21px;letter-spacing:.06em}
.bd p{color:#b5ac9a;font-size:14px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font-size:11.5px;color:var(--dim);border:1px solid var(--line);padding:2px 8px}
.go{margin-top:14px;font-size:13px;letter-spacing:.12em;color:var(--gold)}
.soon{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:220px;color:var(--dim);font-size:14px;letter-spacing:.1em;text-align:center;padding:20px}
.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
footer{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.15em;padding:24px 20px 46px;border-top:1px solid #161312}
</style></head>
